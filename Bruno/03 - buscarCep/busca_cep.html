<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" href="style.css">
    <title>Buscar Cep</title>
</head>
<body>
    <div class="campos">
        <fieldset>
            <label for="nome_usuario">nome</label>
            <input type="text" id="nome_usuario" name="nome_usuario">

            <br>

            <label for="email_usuario">E-mail</label>
            <input type="email" id="email_usuario" name="email_usuario">

            <br>

            <label for="cep_usuario">CEP:</label>
            <input type="text" id="cep_usuario" name="cep_usuario">

            <br>

            <label for="complemento">complemento</label>
            <input type="text" id="complemento" name="complemento">

            <br>

            <label for="bairro">bairro</label>
            <input type="text" id="bairro" name="bairro">

            <br>

            <label for="endereco_usuario">Endereco</label>
            <input type="text" id="endereco_usuario" name="endereco_usuario">
        </fieldset>
    </div>

    <button type="button">Cadastrar</button>

    <script src="script_cep.js"></script>
    
</body>
</html>
