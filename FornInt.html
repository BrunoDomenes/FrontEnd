<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Campeonato</title>
    <link rel="stylesheet" href="styleHtml.css">
</head>
<body>

    <h1>Campeonato Senaquiano Hackatom</h1>
    <p>Preencha os dados abaixo para garantir sua vaga</p>

    <form action="">

        <fieldset>
            <legend>Dados da equipe:</legend>

                <label for="nome_participante">Nome do participante</label>
                <input type="text" name="nome_aluno" id="nome_aluno" placeholder="Ex.: Daniel Gomes" required>

                <label for="email_integrante">E-mail para contato:</label>
                <input type="email" name="email_integrante" id="email_integrante" placeholder="aluno@gmail.com" required>

        </fieldset>
        <fieldset>
            <legend>Caracteristicas da equipe:</legend>

            <label for="Especialista em">Qual linguagem de programação você prefere?</label>
            <input type="radio" id="Python" name="Caracteristicas da equipe" value="Python">
            <label for="Python">Python</label>

            <input type="radio" id="C++" name="Caracteristicas da equipe" value="C++">
            <label for="C++">C++</label>

            <input type="radio" id="Java" name="Caracteristicas da equipe" value="Java">
            <label for="Java">Java</label>
        </fieldset>

        <fieldset>
            <legend>Que tipo de DEV você é?</legend>
            <label for="Tipo_DEV">Qual destes você prefere?</label>

            <input type="checkbox" id="front-end" name="front-end" value="front-end">
            <label for="front-end">front-end</label>

            <input type="checkbox" id="Back-end" name="Back-end" value="Back-end">
            <label for="Back-end">Back-end</label>

            <input type="checkbox" id="FullStack" name="FullStack" value="FullStack">
            <label for="FullStack">FullStack</label>
        </fieldset>

    </form>

</body>
</html>
