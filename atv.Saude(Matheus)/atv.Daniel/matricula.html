<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo-saude.css">
    <title>Senac-Saúde</title>
</head>
<body>
    <h1>Pré-matrícula: Área da Saúde</h1>
    <br>

    <form action="">
        <fieldset >
            <legend>Dados do Aluno</legend>

            <label for="input_nomeCompleto">Nome Completo:</label>
            <input type="text" id="input_nomeCompleto">
            <br>
            <label for="input_email">E-mail:</label>
            <input type="text" id="input_email">
            <br>
            <label for="input_telefone">Telefone:</label>
            <input type="text" id="input_telefone">
            <br>

            <label for="input_cursos">Qual Curso você deseja?</label>
            <select id="input_cursos>
                <option value="tec.estetica">Técnico em Estética</option>
                <option value="tec.farmacia">Técnico em Farmacia</option>
                <option value="tec.analiseClinicas">Técnico em Análise Clínicas</option>
                <option value="tec.enfermagem">Técnico em Enfermagem</option>
            </select>
            <br>
            <button type="submit" id="btn-enviar">Garantir minha vaga!</button>
        </fieldset>
    </form>
</body>
</html>
