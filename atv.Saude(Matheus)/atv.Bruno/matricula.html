<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilo-saude.css">
</head>
<body>

    <h1>Pré-Matricula: Areá da saude</h1>
    <p>Faça sua matricula!</p>
    
    <form action="">
        <fieldset>
            <legend>Dados do aluno:</legend>

             <label for="nome_aluno">Nome do aluno</label>
                <input type="text" name="nome_completo" id="nome_completo" placeholder="Ex.: Daniel Gomes" required>

             <label for="email">E-mail:</label>
                <input type="text" name="email" id="email" placeholder="Ex.: Daniel@gmail.com" required>
            
             <label for="telefone">telefone</label>
                <input type="text" name="telefone" id="telefone" placeholder="Ex.: (16)99999-8888" required>
                <br><br>

                <select name="Escolha o curso:" id="">

                    <option value="">Técnico em Estética</option>
                    <option value="">Técnico em Farmácia</option>
                    <option value="">Técnico em Análises Clínicas</option>
                    <option value="">Técnico em Enfermagem</option>

                </select><br>

                <br><button type="submit" id="btn-enviar">Garantir minha vaga!</button>

        </fieldset>
            
        


    </form>
</body>
</html>
