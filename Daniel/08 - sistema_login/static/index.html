<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Cadastro</title>
    <!-- FontAwesome para ícones (com SRI para garantir a integridade do CDN) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">

    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <div class="container" id="container">
        <!-- Painel de Cadastro -->
        <div class="form-container sign-up-container">
            <form id="form-cadastro">
                <h1>Criar Conta</h1>
                <div class="social-container">
                    <a href="#" class="social" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social" aria-label="Google"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>ou use seu e-mail para registro</span>
                <div class="input-group">
                    <i class="fa fa-user input-icon"></i>
                    <input id="nome_cadastro" type="text" placeholder="Nome Completo"
                           autocomplete="name" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-envelope input-icon"></i>
                    <input id="email_cadastro" type="email" placeholder="E-mail"
                           autocomplete="email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon" data-toggle-senha="senha_cadastro"></i>
                    <input id="senha_cadastro" type="password" placeholder="Senha"
                           autocomplete="new-password" minlength="8" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon" data-toggle-senha="senha_cadastro_confirmar"></i>
                    <input id="senha_cadastro_confirmar" type="password" placeholder="Confirmar Senha"
                           autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn">Cadastrar</button>
                <span id="msg_cadastro"></span>
            </form>
            <script type="module" src="/static/script_cadastro.js?v=2"></script>
        </div>

        <!-- Painel de Login -->
        <div class="form-container sign-in-container">
            <form id="form-login">
                <h1>Entrar</h1>
                <div class="social-container">
                    <a href="#" class="social" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social" aria-label="Google"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>ou use sua conta de e-mail</span>
                <div class="input-group">
                    <i class="fa fa-envelope input-icon"></i>
                    <input id="email_login" type="email" placeholder="E-mail"
                           autocomplete="username" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon" data-toggle-senha="senha_login"></i>
                    <input id="senha_login" type="password" placeholder="Senha"
                           autocomplete="current-password" required>
                </div>
                <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                <button type="submit" class="btn">Entrar</button>
                <span id="msg_login"></span>
            </form>
            <script type="module" src="/static/script_login.js?v=2"></script>
        </div>

        <!-- Painel de Sobreposição (Overlay) -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Bem-vindo de Volta!</h1>
                    <p>Para se manter conectado conosco, por favor faça login com seus dados pessoais</p>
                    <button class="btn ghost" id="signIn">Entrar</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Olá, Amigo!</h1>
                    <p>Insira seus dados pessoais e comece sua jornada conosco hoje</p>
                    <button class="btn ghost" id="signUp">Cadastrar-se</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js?v=2"></script>
</body>
</html>
