<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Campeonato</title>
</head>
<body>

    <h1>Campeonato Senaquiano Hackatom</h1>
    <p>Preencha os dados abaixo para garantir sua vaga</p>

    <form action="">

        <fieldset>
            <legend>Dados da equipe:</legend>

                <label for="nome_participante">Nome do participante</label>
                <input type="text" name="nome_aluno" id="nome_aluno" placeholder="Ex.: Daniel Gomes" required>

                <label for="email_integrante">E-mail para contato:</label>
                <input type="email" name="email_integrante" id="email_integrante" placeholder="aluno@gmail.com" required>

        </fieldset>

    </form>

</body>
</html>
